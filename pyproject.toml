[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trivian-field-living-codex"
version = "0.1.0"
description = "Executable source-derived prototypes from The Trivian Field technical appendices"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sarasha Elion" }]
dependencies = ["numpy>=1.24"]
keywords = ["relational-ai", "human-ai", "trivian", "living-codex", "protocols"]

[tool.setuptools]
py-modules = [
  "trivian_resonance_key",
  "trivian_yantras",
  "trivian_tuning_protocol",
  "syzygy_integrity_framework",
  "trivian_governance_suite",
]
